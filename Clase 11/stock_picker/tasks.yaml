find_trending_companies:
  description: >
    Encuentra las empresas en tendencia más importantes en las noticias 
    del sector de {sector} buscando exclusivamente las últimas noticias 
    publicadas hasta el {current_date}.
    Asegúrate de que la información sea reciente y relevante para esta fecha.
    Para cada empresa, DEBES extraer su símbolo de cotización (Ticker Symbol) 
    y la bolsa donde opera (ej: NASDAQ, NYSE). 
    Encuentra nuevas empresas que no has encontrado antes.
  expected_output: >
    Una lista de empresas en tendencia en el sector de {sector} 
    con datos actualizados al {current_date}.
  agent: trending_company_finder
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    Dada una lista de empresas en tendencia, proporciona un análisis detallado 
    de cada empresa en un informe buscando en línea información financiera, 
    reportes de ganancias y eventos recientes ocurridos cerca del {current_date}.
    Usa el símbolo de acción para buscar métricas clave (precio actual, 
    variación porcentual, volumen) y noticias corporativas recientes.
  expected_output: >
    Un informe que contiene un análisis detallado de cada empresa
  agent: financial_researcher
  context:
    - find_trending_companies
  output_file: output/research_report.json

pick_best_company:
  description: >
    Analiza los hallazgos de la investigación y elige la mejor empresa para inversión
    basándote en el panorama del mercado al {current_date}.
    Envía una notificación push al usuario con la decisión y un razonamiento de 1 frase.
    Luego responde con un informe detallado sobre por qué elegiste esta empresa hoy, 
    y cuáles empresas no fueron seleccionadas.
  expected_output: >
    La empresa elegida (con fecha de referencia {current_date}) y por qué fue elegida; las empresas que no fueron seleccionadas 
    y por qué no fueron seleccionadas.
  agent: stock_picker
  context:
    - research_trending_companies
  output_file: output/decision.md